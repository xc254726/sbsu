name: Build Evil with Card Key

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          set -e
          curl -sL -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar
          echo "BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n1)" >> $GITHUB_ENV
          echo "ANDROID_JAR=$(ls $ANDROID_HOME/platforms/*/android.jar | sort -V | tail -n1)" >> $GITHUB_ENV
      - name: Decode
        run: |
          set -e
          java -jar apktool.jar d -f tools/evil.apk -o evil
          ls evil | head
      - name: Locate cardkey screen
        run: |
          echo "==== Hygq 里的字符串常量（JSON 字段名）===="
          grep -oE 'const-string[^,]*, "[^"]*"' evil/smali/o/Hygq.smali | sed 's/.*, //' | head -40
          echo "==== a20 里的字符串常量 ===="
          grep -oE 'const-string[^,]*, "[^"]*"' evil/smali/o/a20.smali | sed 's/.*, //' | head -30
          echo "==== 全仓搜 json 字段名 ===="
          grep -rhoE '"(license|device|expires|expireAt|expire_at|token|ok|success|code|msg|message|status|data)"' evil/smali | sort | uniq -c | sort -rn | head -25
      - name: Build gate dex
        run: |
          set -e
          mkdir -p gate_classes gate_dex
          javac -source 8 -target 8 -nowarn -bootclasspath "$ANDROID_JAR" -d gate_classes tools/gate/GateActivity.java
          "$BUILD_TOOLS/d8" --lib "$ANDROID_JAR" --min-api 26 --output gate_dex $(find gate_classes -name "*.class")
          cp gate_dex/classes.dex classes2.dex
          ls -l classes2.dex
      - name: Patch manifest
        run: |
          set -e
          python3 - <<'PY'
          import re
          p = 'evil/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          pat = re.compile(r'\s*<intent-filter>(?:(?!</intent-filter>).)*?android\.intent\.category\.LAUNCHER(?:(?!</intent-filter>).)*?</intent-filter>', re.S)
          print('launcher filters removed:', len(pat.findall(s)))
          s = pat.sub('', s)
          gate = '\n    <activity android:name="com.sb.gate.GateActivity" android:exported="true" android:theme="@android:style/Theme.DeviceDefault.Light.NoActionBar" android:configChanges="orientation|screenSize|keyboardHidden">\n      <intent-filter>\n        <action android:name="android.intent.action.MAIN" />\n        <category android:name="android.intent.category.LAUNCHER" />\n      </intent-filter>\n    </activity>\n'
          s = s.replace('</application>', gate + '</application>')
          m = re.search(r'<application\b[^>]*>', s)
          if m:
              tag = m.group(0)
              tag2 = re.sub(r'android:label="[^"]*"', 'android:label="hh"', tag) if 'android:label=' in tag else tag[:-1] + ' android:label="hh">'
              s = s.replace(tag, tag2, 1)
          mc = re.search(r'android:versionCode="(\d+)"', s)
          cur = int(mc.group(1)) if mc else 0
          s = re.sub(r'android:versionCode="\d+"', 'android:versionCode="34000"', s)
          s = re.sub(r'android:versionName="[^"]*"', 'android:versionName="v3.3.1-hh"', s)
          open(p, 'w', encoding='utf-8').write(s)
          print('ok, versionCode', cur, '-> 34000')
          PY
          grep -o 'package="[^"]*"' evil/AndroidManifest.xml | head -1
          grep -c 'com.sb.gate.GateActivity' evil/AndroidManifest.xml
      - name: Point license server to sbkey
        run: |
          set -e
          python3 - <<'PY'
          import os
          OLD = 'https://evil.nogay.cn'
          NEW = 'https://sbkey.dpdns.org'
          n = 0
          for dp, _, fns in os.walk('evil/smali'):
              for fn in fns:
                  if not fn.endswith('.smali'):
                      continue
                  p = os.path.join(dp, fn)
                  try:
                      s = open(p, encoding='utf-8', errors='ignore').read()
                  except Exception:
                      continue
                  if OLD in s:
                      open(p, 'w', encoding='utf-8').write(s.replace(OLD, NEW))
                      n += 1
          print('patched smali files:', n)
          PY
          grep -rl "sbkey.dpdns.org" evil/smali | head -3
      - name: Rebrand to sb
        run: |
          set -e
          python3 - <<'PY'
          import os, re, shutil, glob

          OLD, NEW = 'com.evilsu', 'com.sbsu'
          OLDS, NEWS = 'com/evilsu', 'com/sbsu'

          # 1) smali 内容
          for dp, _, fns in os.walk('evil/smali'):
              for fn in fns:
                  if not fn.endswith('.smali'):
                      continue
                  p = os.path.join(dp, fn)
                  try:
                      s = open(p, encoding='utf-8', errors='ignore').read()
                  except Exception:
                      continue
                  if OLD in s or OLDS in s:
                      open(p, 'w', encoding='utf-8').write(s.replace(OLD, NEW).replace(OLDS, NEWS))

          # 2) 目录改名
          src = 'evil/smali/' + OLDS
          dst = 'evil/smali/' + NEWS
          if os.path.isdir(src):
              os.makedirs(os.path.dirname(dst), exist_ok=True)
              if os.path.isdir(dst):
                  for it in os.listdir(src):
                      shutil.move(os.path.join(src, it), os.path.join(dst, it))
                  shutil.rmtree(src)
              else:
                  shutil.move(src, dst)
              print('smali dir renamed')

          # 3) manifest
          mp = 'evil/AndroidManifest.xml'
          s = open(mp, encoding='utf-8').read()
          s = s.replace(OLD, NEW)
          s = re.sub(r'android:label="[^"]*"', 'android:label="sb"', s, count=1)
          mc = re.search(r'android:versionCode="(\d+)"', s)
          s = re.sub(r'android:versionCode="\d+"', 'android:versionCode="34100"', s)
          open(mp, 'w', encoding='utf-8').write(s)
          print('manifest ok')

          # 4) apktool.yml versionCode
          ap = 'evil/apktool.yml'
          if os.path.exists(ap):
              a = open(ap, encoding='utf-8').read()
              a = re.sub(r"versionCode: '?\d+'?", "versionCode: '34100'", a)
              a = re.sub(r"versionName: .*", "versionName: 'v3.3.1-sb'", a)
              open(ap, 'w', encoding='utf-8').write(a)
              print('apktool.yml ok')

          # 5) res 里的包名
          for dp, _, fns in os.walk('evil/res'):
              for fn in fns:
                  if not fn.endswith('.xml'):
                      continue
                  p = os.path.join(dp, fn)
                  try:
                      s = open(p, encoding='utf-8', errors='ignore').read()
                  except Exception:
                      continue
                  if OLD in s:
                      open(p, 'w', encoding='utf-8').write(s.replace(OLD, NEW))

          # 6) 图标：用 sb 的
          icons = glob.glob('manager/app/src/main/res/drawable*/app_icon_photo.*') + glob.glob('manager/app/src/main/res/mipmap-*/ic_launcher.*')
          print('sb icons found:', len(icons))
          if icons:
              src_icon = icons[0]
              for d in glob.glob('evil/res/mipmap-*'):
                  for ext in ['png', 'webp', 'jpg']:
                      tgt = os.path.join(d, 'ic_launcher.' + ext)
                      if os.path.exists(tgt):
                          shutil.copyfile(src_icon, tgt)
              for n in ['ic_launcher.png', 'ic_launcher.webp', 'ic_launcher_round.png', 'ic_launcher_round.webp']:
                  for d in glob.glob('evil/res/mipmap-*'):
                      tgt = os.path.join(d, n)
                      if os.path.exists(tgt):
                          shutil.copyfile(src_icon, tgt)
              print('icon replaced with', src_icon)
          PY
          grep -o 'package="[^"]*"' evil/AndroidManifest.xml | head -1
          grep -o 'android:label="[^"]*"' evil/AndroidManifest.xml | head -1
      - name: Rebuild
        run: |
          set -e
          rm -f evil/res/xml/_generated_res_locale_config.xml || true
          java -jar apktool.jar b evil -o unsigned.apk
          zip -q unsigned.apk classes2.dex
          unzip -l unsigned.apk | grep -E "classes.*dex"
      - name: Sign v2 only
        run: |
          set -e
          echo "${{ secrets.KEYSTORE }}" | base64 -d > key.jks
          "$BUILD_TOOLS/zipalign" -f -p 4 unsigned.apk aligned.apk
          "$BUILD_TOOLS/apksigner" sign --v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled false \
            --ks key.jks --ks-pass pass:"${{ secrets.KEYSTORE_PASSWORD }}" --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --key-pass pass:"${{ secrets.KEY_PASSWORD }}" --out evil-cardkey.apk aligned.apk
          "$BUILD_TOOLS/apksigner" verify --print-certs evil-cardkey.apk | head -3
          ls -l evil-cardkey.apk
      - uses: actions/upload-artifact@v7
        with:
          name: evil-cardkey
          path: evil-cardkey.apk